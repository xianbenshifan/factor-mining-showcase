<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>因子挖掘系统 · 界面演示</title>
  <meta name="description" content="量化因子挖掘系统的界面演示（合成数据）" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 5l1.6 4.4L18 11l-4.4 1.6L12 17l-1.6-4.4L6 11l4.4-1.6z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="header glass-strong">
    <div class="container header-inner">
      <div class="brand" role="button" tabindex="0" aria-label="回到因子挖掘">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">WikiAlpha</h1>
          <p class="brand-sub">Wiki 增强的 LLM 因子挖掘框架</p>
        </div>
      </div>

      <div class="header-actions">
        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-page="mine" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>
            </svg>
            <span>因子挖掘</span>
          </button>
          <button class="nav-item" data-page="library" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <ellipse cx="12" cy="5" rx="8" ry="3"/>
              <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
              <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
            </svg>
            <span>因子库</span>
          </button>
          <button class="nav-item" data-page="data" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>
            </svg>
            <span>数据</span>
          </button>
        </nav>

        <button class="btn btn-ghost btn-sm" id="cache-btn" type="button" title="缓存库（体积 / 命中率 / 可清理量）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h2"/>
          </svg>
          <span>缓存</span>
        </button>

        <button class="btn btn-ghost btn-sm" id="settings-btn" type="button" title="全局设置（并行 / LLM / 日志）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8L7 17M17 7l2.8-2.8"/>
          </svg>
          <span>设置</span>
        </button>

        <button class="btn btn-ghost btn-sm" id="theme-btn" type="button" title="切换深浅色" aria-label="切换深浅色"></button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container" id="app"></div>
  </main>

  <div id="modal" style="display:none"></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
