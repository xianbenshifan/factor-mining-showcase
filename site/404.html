<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>页面不存在</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #0b1020; color: #eef2f8;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center; padding: 24px;
  }
  .box { max-width: 42ch; }
  .code { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; opacity: .3; }
  h1 { font-size: 19px; font-weight: 600; margin: 10px 0 8px; }
  p { margin: 0 0 20px; color: #9aa7bd; font-size: 13.5px; line-height: 1.7; }
  a {
    display: inline-block; padding: 9px 20px; border-radius: 9px;
    background: linear-gradient(135deg, #3b82f6, #7c3aed);
    color: #fff; text-decoration: none; font-size: 13.5px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>本页仅供项目展示，只公开了部分内容。你访问的地址可能未收录或已变更。</p>
    <a href="/">回到演示首页</a>
  </div>
</body>
</html>
