<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="color-scheme" content="dark light" />
<title>因子挖掘系统 · 演示视频</title>
<meta name="description" content="量化因子挖掘系统演示视频" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M10 8.5l6 3.5-6 3.5z' fill='white'/%3E%3C/svg%3E" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0b1020;
    --bg-2: #131a30;
    --fg: #eef2f8;
    --muted: #9aa7bd;
    --accent: #7c5cff;
    --accent-2: #3b82f6;
    --border: rgba(255, 255, 255, 0.1);
    --radius: 14px;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before {
    content: "";
    position: fixed;
    inset: -20% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(45% 60% at 22% 0%, rgba(124, 92, 255, 0.28), transparent 70%),
      radial-gradient(45% 60% at 80% 8%, rgba(59, 130, 246, 0.22), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 22px 30px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  header { margin-bottom: 22px; text-align: center; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 999px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, rgba(124, 92, 255, 0.18), rgba(59, 130, 246, 0.14));
    border: 1px solid rgba(124, 92, 255, 0.34);
    color: #c3b6ff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  h1 {
    margin: 0;
    font-size: clamp(21px, 3.2vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .sub {
    margin: 10px auto 0;
    max-width: 62ch;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.75;
  }

  /* 播放器 */
  .player {
    position: relative;
    margin: 26px auto 0;
    width: 100%;
    border-radius: var(--radius);
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.75), rgba(124, 92, 255, 0.9) 55%, rgba(236, 72, 153, 0.7));
    box-shadow: 0 26px 60px -26px rgba(124, 92, 255, 0.55);
  }

  .player-inner {
    position: relative;
    border-radius: calc(var(--radius) - 1px);
    background: #000;
    overflow: hidden;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 74vh;
    background: #000;
    vertical-align: middle;
  }

  /* 海报层：视频下载完成前显示，点击后播放 */
  .poster {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080c17;
    cursor: pointer;
    border: none;
    padding: 0;
    width: 100%;
    height: 100%;
    color: inherit;
    font: inherit;
  }

  /* 下载完成前禁用点击，避免误以为没反应 */
  .poster[data-loading="1"] { cursor: progress; }

  .poster img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.5;
  }

  .poster[hidden] { display: none; }

  /* 下载进度条 */
  .dl {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }

  .dl[hidden] { display: none; }

  .dl i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.2s ease;
  }

  .play-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);
    color: #1a1f2e;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .poster:hover .play-btn { transform: scale(1.08); box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55); }
  .poster:focus-visible .play-btn { outline: 3px solid var(--accent); outline-offset: 4px; }

  .poster-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 16px;
    text-align: center;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.82);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
  }

  code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: rgba(255, 255, 255, 0.08);
    padding: 1.5px 6px;
    border-radius: 4px;
    font-size: 0.94em;
  }

  @media (max-width: 640px) {
    .wrap { padding: 26px 14px 22px; }
    video { max-height: 56vh; }
    .play-btn { width: 60px; height: 60px; }
    header { margin-bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
        </svg>
        演示视频
      </span>
      <h1>因子挖掘系统</h1>
      <p class="sub">
        从研究方向到已验证因子的完整闭环：知识库参与搜索空间与提示词组装，
        遗传规划与代码生成双轨产出，经相关性去重与未来信息审计后落库。
      </p>
    </header>

    <div class="player">
      <div class="player-inner">
        <video id="v" preload="none" playsinline
               width="2560" height="1238"></video>

        <button class="poster" id="poster" type="button" aria-label="播放演示视频">
          <img src="media/poster.jpg" alt="" />
          <span class="play-btn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.5v13l11-6.5z"/>
            </svg>
          </span>
          <span class="poster-hint" id="hint">正在加载视频…</span>
          <span class="dl" id="dl"><i id="dlfill"></i></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var v = document.getElementById('v');
      var poster = document.getElementById('poster');
      var hint = document.getElementById('hint');
      var dl = document.getElementById('dl');
      var dlfill = document.getElementById('dlfill');

      // 选源：支持 AV1 就用它（更小、保留原分辨率），否则回退 H.264
      var probe = document.createElement('video');
      var SRC = probe.canPlayType('video/mp4; codecs="av01.0.05M.08"')
        ? 'media/av1.mp4'
        : 'media/h264.mp4';

      var ready = false;        // 是否已备好可播放的源
      var pendingPlay = false;  // 用户在下载途中点了播放
      var blobUrl = null;

      function setHint(t) { hint.textContent = t; }

      function play() {
        if (!ready) { pendingPlay = true; return; }
        poster.hidden = true;
        v.controls = true;
        v.play().catch(function () { /* 被拒时保留控制条，用户可手动点 */ });
      }

      // 先把整段视频下载到本地（Blob），再播放。
      //
      // 为什么不用直链流式播放：本环境的分段传输不可用，
      // 直链播放时 video.seekable 会是 [0,0]，进度条拖不动（会弹回）。
      // 整段下载到本地后，媒体完全可用，任意跳转都成立 —— 不依赖服务器支持 Range。
      function load() {
        setHint('正在加载视频…');
        dl.hidden = false;
        poster.dataset.loading = '1';

        fetch(SRC)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var total = Number(r.headers.get('content-length')) || 0;
            if (!r.body || !total) return r.blob();
            var reader = r.body.getReader();
            var chunks = [];
            var got = 0;
            return (function pump() {
              return reader.read().then(function (res) {
                if (res.done) return new Blob(chunks, { type: 'video/mp4' });
                chunks.push(res.value);
                got += res.value.length;
                var pct = Math.min(100, Math.round((got / total) * 100));
                dlfill.style.width = pct + '%';
                setHint('正在加载视频 ' + pct + '%');
                return pump();
              });
            })();
          })
          .then(function (blob) {
            blobUrl = URL.createObjectURL(blob);
            v.src = blobUrl;
            v.preload = 'auto';
            ready = true;
            dl.hidden = true;
            delete poster.dataset.loading;
            setHint('点击播放 · 约 2 分 28 秒');
            if (pendingPlay) play();
          })
          .catch(function () {
            // 回退：直接用直链。能正常播放，但进度条可能拖不动。
            v.src = SRC;
            v.preload = 'metadata';
            ready = true;
            dl.hidden = true;
            delete poster.dataset.loading;
            setHint('点击播放 · 约 2 分 28 秒');
            if (pendingPlay) play();
          });
      }

      poster.addEventListener('click', function () {
        // 下载还没好：记下意图，好了自动播
        play();
      });

      // 播完回到封面态
      v.addEventListener('ended', function () {
        poster.hidden = false;
        v.controls = false;
        v.currentTime = 0;
      });

      // 键盘可达
      poster.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
      });

      load();
    })();
  </script>
</body>
</html>
